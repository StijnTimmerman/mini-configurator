<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini Configurator — 3D product configurator</title>
  <meta name="description" content="A tiny open-source 3D product configurator built with Three.js. Rotate the product and configure colors and finish per part. No build step." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --ink: #1b1b22; --muted: #6a6a78; --line: #e6e6ec; --panel: #ffffff;
      --accent: #5b6cff; --ring: #5b6cff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink); background: #ececed; overflow: hidden;
    }
    .app { display: flex; height: 100%; }
    @media (max-width: 760px) { .app { flex-direction: column; } }

    .stage { position: relative; flex: 1; min-height: 0;
      background: radial-gradient(120% 90% at 50% 20%, #fbfbfc 0%, #e3e3e8 70%, #d3d3da 100%); }
    #view { display: block; width: 100%; height: 100%; }
    .hint { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
      font-size: 12px; color: var(--muted); background: rgba(255,255,255,.7);
      padding: 6px 12px; border-radius: 999px; backdrop-filter: blur(4px); pointer-events: none; }

    .panel { width: 340px; flex-shrink: 0; background: var(--panel); border-left: 1px solid var(--line);
      padding: 28px 26px; overflow-y: auto; }
    @media (max-width: 760px) { .panel { width: 100%; border-left: none; border-top: 1px solid var(--line);
      max-height: 46%; padding: 20px; } }

    .panel h1 { font-size: 19px; letter-spacing: -.01em; }
    .panel .sub { color: var(--muted); font-size: 13px; margin-top: 3px; margin-bottom: 22px; }

    .group { margin-bottom: 22px; }
    .group > label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
    .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
    .swatch { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: none;
      box-shadow: 0 0 0 2px #fff, 0 0 0 3px var(--line); transition: transform .12s, box-shadow .12s; }
    .swatch:hover { transform: scale(1.08); }
    .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px #fff, 0 0 0 3px var(--ring); transform: scale(1.08); }

    .segment { display: flex; gap: 6px; background: #f2f2f5; padding: 4px; border-radius: 10px; }
    .segment button { flex: 1; border: none; background: transparent; padding: 8px 6px; border-radius: 7px;
      font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; }
    .segment button[aria-pressed="true"] { background: #fff; color: var(--ink);
      box-shadow: 0 1px 3px rgba(0,0,0,.08); }

    .summary { border-top: 1px solid var(--line); padding-top: 18px; font-size: 13px; color: var(--muted); }
    .summary b { color: var(--ink); font-weight: 600; }
    .summary div { display: flex; justify-content: space-between; padding: 3px 0; }
    .reset { margin-top: 18px; width: 100%; padding: 11px; border: 1px solid var(--line);
      background: #fff; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--ink); }
    .reset:hover { background: #f7f7f9; }
    .credit { margin-top: 22px; font-size: 11px; color: var(--muted); }
    .credit a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="app">
    <div class="stage">
      <canvas id="view"></canvas>
      <div class="hint">Drag to rotate · scroll to zoom</div>
    </div>

    <aside class="panel">
      <h1>Lounge Chair</h1>
      <p class="sub">Configure your chair — drag the model to look around.</p>

      <!-- Parts get their swatches injected from configurator.js so colors stay in one place -->
      <div class="group" data-part="frame">
        <label>Frame</label>
        <div class="swatches"></div>
      </div>
      <div class="group" data-part="seat">
        <label>Seat</label>
        <div class="swatches"></div>
      </div>
      <div class="group" data-part="back">
        <label>Backrest</label>
        <div class="swatches"></div>
      </div>

      <div class="group">
        <label>Finish</label>
        <div class="segment" id="finish">
          <button data-finish="matte" aria-pressed="true">Matte</button>
          <button data-finish="satin">Satin</button>
          <button data-finish="gloss">Gloss</button>
        </div>
      </div>

      <div class="summary" id="summary"></div>
      <button class="reset" id="reset">Reset</button>
      <p class="credit">Open-source code sample by <a href="https://steildigital.nl" target="_blank" rel="noopener">Steil Digital</a> · <a href="https://store.steildigital.nl" target="_blank" rel="noopener">Mini Configurator Pro</a></p>
    </aside>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="configurator.js"></script>
</body>
</html>
